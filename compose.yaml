services:
  postgres:
    image: postgres:16-alpine
    container_name: mrp-postgres
    environment:
      POSTGRES_DB: mrp
      POSTGRES_USER: mrp
      POSTGRES_PASSWORD: mrp
    ports:
      - "5432:5432"
    volumes:
      - mrp-postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrp -d mrp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mrp-postgres-data:
